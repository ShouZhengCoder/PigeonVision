feat_dim: 256  # Single encoder dim; fusion total dim is configured below.
backbone: resnet34
in_channels: 3
triplet_margin: 0.3
warmup_epochs: 3
smoke_gate_epoch: 5
batch_size: 64
lr: 0.0003
epochs: 80
optimizer: adam
scheduler: cosine
input_shape: [64, 512]
normalize_mean: [0.5, 0.5, 0.5]
normalize_std: [0.5, 0.5, 0.5]
checkpoint_dir: checkpoints/siamese/
iris_dir: outputs/iris_normalized/
normalize_meta: outputs/iris_normalized/normalize_meta.csv
pigeon_csv: data/extracted/datasetXGN/pigeon.csv
train_meta: data/train_meta.csv
min_images_per_blood: 5
min_images_per_blood_id: 2
min_db_images_per_blood: 20
val_ratio: 0.2
seed: 42
classes_per_batch: 16
samples_per_class: 4
batches_per_epoch: 0
compare_eval_pairs: 200000
pairs: data/pairs_train.csv

# Single encoder (Relation-SupCon 256d)
fusion:
  enabled: true
  total_dim: 256
  encoders:
    - checkpoint: checkpoints/siamese/relation_supcon/best.pt
      feat_dim: 256
      backbone: resnet34
  faiss_index: outputs/features/relation_supcon_256d/faiss_index.bin
  feature_meta: outputs/features/relation_supcon_256d/feature_db_meta.csv
